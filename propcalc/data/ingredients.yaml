# 사용자 정의 반응물 DB.
# 규칙: 모든 항목은 source 와 verification 을 가져야 한다 (출처 없는 값은 넣지 않는다).
#   verification:
#     primary   - 1차 문헌/DB 원문에서 직접 확인함
#     secondary - 2차 자료(미러, 요약 사이트 등)에서 확인함
#     doc_only  - 작업 지시서에 적힌 값이며 이 세션에서 원문을 확인하지 못함
#   u_dHf_kJ_per_mol 이 null 이면 불확실도 미확인 (민감도 분석 대상에서 제외).
# 단위: dHf = 298.15 K 표준 생성엔탈피 (kJ/mol), M = g/mol.

KNO3:
  name: 질산칼륨 KNO3(cr)
  formula: {K: 1, N: 1, O: 3}
  dHf_kJ_per_mol: -494.63
  u_dHf_kJ_per_mol: null
  M_g_per_mol: 101.1032
  phase: cr
  source: >
    Wagman et al. 1982, NBS Tables of Chemical Thermodynamic Properties,
    J. Phys. Chem. Ref. Data 11 (Suppl. 2). 이 세션에서 원문 값 미확인;
    2차 자료는 -494.5 (chemister.ru), -494.0 (webqc.org)로 +-0.6 kJ/mol 범위에서 일치.
  verification: secondary
  note: >
    CEA 내장 'KNO3' 는 기체상 종(약 -315.8 kJ/mol, 이 세션에서 calc_property 로 확인)이며
    고체가 아니다. 고체 KNO3 는 반드시 이 값으로 커스텀 반응물로 정의해야 한다.

SORBITOL:
  name: D-소르비톨 (D-glucitol)
  formula: {C: 6, H: 14, O: 6}
  dHf_kJ_per_mol: -1353.70
  u_dHf_kJ_per_mol: 1.40
  M_g_per_mol: 182.1718
  phase: cr
  source: >
    NIST Chemistry WebBook (SRD 69), CAS 50-70-4, "Condensed phase thermochemistry data":
    Delta_f H(solid) = -1353.7 +- 1.4 kJ/mol, 방법 Ccb, 인용 Gerasimov, Blokh, et al., 1985
    (Izv. Vyssh. Uchebn. Zaved., Khim. Khim. Tekhnol. 28, 54-56), 편집 주석 ALS (Afeefy, Liebman, Stein).
    Delta_c H(solid) = -3009.4 +- 1.4 kJ/mol. 2026-10-30 webbook.nist.gov 페이지
    (https://webbook.nist.gov/cgi/cbook.cgi?ID=C50704&Units=SI&Mask=2) 에서 직접 확인.
  verification: primary
  note: >
    primary 는 NIST WebBook 원문 확인을 뜻하며, WebBook 이 인용한 Gerasimov 1985 원논문은 확인하지
    못했다. 같은 페이지의 연소열 주석은 "Corresponding Delta_f H = -1352.5 kJ/mol (simple calculation
    by NIST; no Washburn corrections)" 이어서 -1353.7 과 1.2 kJ/mol 차이가 나며 보고 불확실도 안이다.
    출처가 1985년 단일 연소열 측정(비타민 C 합성 중간체 보고)이므로 u=1.4 가 실제 불확실도를
    과소평가할 가능성은 배제하지 못한다.

