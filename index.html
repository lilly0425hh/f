<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3182f6">
<title>토큰 베팅 자리 배치</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#f2f4f6;--card:#fff;--ink:#191f28;--ink2:#4e5968;--ink3:#8b95a1;--line:#e5e8eb;
  --pri:#3182f6;--pri-d:#1b64da;--pri-bg:#e8f3ff;--ok:#00a37a;--ok-bg:#e3f8f1;
  --warn:#f59f00;--warn-bg:#fff4dd;--bad:#f04452;--bad-bg:#ffe8ea;--gold:#ffb300;
  --shadow:0 1px 3px rgba(0,0,0,.04),0 8px 24px rgba(25,31,40,.07);
  --font:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;min-height:100vh;overscroll-behavior-y:none}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.hidden{display:none!important}
.muted{color:var(--ink3)} .small{font-size:13px} .tiny{font-size:12px}
.row{display:flex;align-items:center;gap:8px} .row.wrap{flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:12px}
.grow{flex:1;min-width:0} .right{margin-left:auto}
.center{text-align:center}

/* layout */
#app{max-width:520px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
#app.wide{max-width:1180px}
.topbar{position:sticky;top:0;z-index:20;margin:0 -16px;padding:12px 16px;background:rgba(242,244,246,.88);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:center;gap:10px}
.topbar h1{font-size:17px;font-weight:800;letter-spacing:-.02em}
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:20px;margin-top:14px}
.card h2{font-size:17px;font-weight:800;letter-spacing:-.02em;margin-bottom:12px}
.card h3{font-size:15px;font-weight:700;margin-bottom:8px}
.hero{padding:26px 22px}
.hero h2{font-size:24px;line-height:1.3;margin-bottom:6px}

/* controls */
.btn{appearance:none;border:0;border-radius:14px;padding:13px 18px;font-weight:700;cursor:pointer;background:#e5e8eb;color:var(--ink2);
  transition:transform .12s cubic-bezier(.3,1.6,.5,1),background .15s,box-shadow .15s;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px}
.btn:hover{background:#dde1e6}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--pri);color:#fff;box-shadow:0 6px 16px rgba(49,130,246,.32)}
.btn.primary:hover{background:var(--pri-d)}
.btn.good{background:var(--ok);color:#fff}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.ghost{background:transparent;color:var(--ink2)}
.btn.sm{padding:7px 12px;min-height:34px;border-radius:11px;font-size:13px}
.btn.block{width:100%}
.btn.big{padding:17px 22px;font-size:17px;border-radius:18px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--ink2)}
.input,select.input,textarea.input{width:100%;border:1.5px solid var(--line);background:#f9fafb;border-radius:14px;padding:13px 14px;outline:none;transition:border-color .15s,background .15s}
.input:focus{border-color:var(--pri);background:#fff}
textarea.input{min-height:110px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:700;background:#eef0f3;color:var(--ink2);white-space:nowrap}
.chip.blue{background:var(--pri-bg);color:var(--pri-d)} .chip.green{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:#b07400} .chip.red{background:var(--bad-bg);color:var(--bad)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.live .dot{animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.tabs{display:flex;gap:6px;overflow:auto;padding:2px 0 10px;scrollbar-width:none}
.tabs button{border:0;background:#e9ecef;border-radius:999px;padding:8px 14px;font-weight:700;color:var(--ink2);cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--ink);color:#fff}
details{background:#f9fafb;border-radius:14px;padding:12px 14px;margin-top:10px}
summary{cursor:pointer;font-weight:700;color:var(--ink2)}
details p{margin-top:8px;color:var(--ink2)}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:14px}
th{font-size:12.5px;color:var(--ink3);font-weight:600;position:sticky;top:0;background:#fff}
.scroll{max-height:380px;overflow:auto;border-radius:12px;border:1px solid var(--line)}
.notice{padding:12px 14px;border-radius:14px;background:var(--warn-bg);color:#8a5a00;font-size:14px}
.notice.bad{background:var(--bad-bg);color:#b3202c} .notice.ok{background:var(--ok-bg);color:#007a5c} .notice.info{background:var(--pri-bg);color:var(--pri-d)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}
.progress{height:10px;border-radius:99px;background:#e9ecef;overflow:hidden}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),#5aa0ff);border-radius:99px;transition:width .35s cubic-bezier(.3,1.2,.5,1)}

/* token header */
.tokenhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.tokenhead .big{font-size:40px;font-weight:800;letter-spacing:-.04em;line-height:1}
.tokenhead .big small{font-size:18px;color:var(--ink3);font-weight:700}
.bump{animation:bump .35s cubic-bezier(.3,1.8,.5,1)}
@keyframes bump{40%{transform:scale(1.18)}}

/* room grid */
.room{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.room .deskbar{align-self:center;padding:6px 26px;border-radius:12px;background:#dfe3e8;color:var(--ink2);font-weight:800;font-size:13px;letter-spacing:.2em}
.room .mid{display:flex;gap:6px;align-items:stretch}
.room .side{flex:0 0 22px;border-radius:10px;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;font-size:12px;font-weight:700;letter-spacing:.3em}
.room .side.win{background:linear-gradient(180deg,#d6ecff,#c3e2ff);color:#2b6cb0}
.room .side.hall{background:#eceff3;color:var(--ink3)}
.seatgrid{flex:1;min-width:0;display:grid;row-gap:6px;container-type:inline-size;--n:8}
.seat{--heat:0;position:relative;appearance:none;border:1.5px solid var(--line);aspect-ratio:1/1;min-width:0;padding:0;border-radius:14%;
  background:color-mix(in srgb,var(--pri) calc(var(--heat)*30%),#fff);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:transform .12s cubic-bezier(.3,1.7,.5,1),border-color .15s,box-shadow .15s;overflow:visible;line-height:1.1}
.seat:active{transform:scale(.92)}
.seat .num{font-weight:800;font-size:max(11px,calc(100cqw / var(--n) * .36));letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.seat .num.pop{animation:pop .5s cubic-bezier(.3,1.9,.5,1)}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.55);color:var(--pri)}100%{transform:scale(1)}}
.seat .badge{position:absolute;top:-7px;right:-4px;background:var(--pri);color:#fff;border-radius:99px;padding:1px 6px;font-size:max(9px,calc(100cqw / var(--n) * .21));font-weight:800;box-shadow:0 2px 6px rgba(49,130,246,.45);animation:badgein .3s cubic-bezier(.3,1.9,.5,1);white-space:nowrap;z-index:1}
.seat .badge.draft{background:#fff;color:var(--pri);border:1.5px dashed var(--pri);box-shadow:none}
@keyframes badgein{from{transform:scale(0)}}
.seat .nm{font-weight:700;font-size:max(9px,calc(100cqw / var(--n) * .24));word-break:keep-all;text-align:center;padding:0 2px}
.seat .tag{position:absolute;bottom:2px;right:3px;font-size:max(8px,calc(100cqw / var(--n) * .19))}
.seat.off{background:transparent;border:1.5px dashed #d3d8de;cursor:default;color:#c1c7ce}
.seat.off .num{font-size:max(11px,calc(100cqw / var(--n) * .3));font-weight:600}
.seat.sel{border-color:var(--pri);box-shadow:0 0 0 3px rgba(49,130,246,.25)}
.seat.me{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,179,0,.35);background:#fff8e1;animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 7px rgba(255,179,0,.15)}}
.seat.empty .nm{color:var(--ink3);font-weight:500}
.seat.dim{opacity:.55}
.seat.static{cursor:default}
.seat.drop{animation:drop .5s cubic-bezier(.2,1.9,.4,1)}
@keyframes drop{0%{transform:translateY(-34%) scale(1.5);opacity:0}60%{opacity:1}100%{transform:none}}

/* bottom sheet */
.scrim{position:fixed;inset:0;background:rgba(15,20,28,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;z-index:41;width:min(520px,100%);transform:translate(-50%,105%);background:#fff;border-radius:28px 28px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom));
  box-shadow:0 -12px 40px rgba(0,0,0,.18);transition:transform .32s cubic-bezier(.2,1.1,.3,1)}
.sheet.on{transform:translate(-50%,0)}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:#d9dde2;margin:4px auto 14px}
.sheet .mine{font-size:46px;font-weight:800;letter-spacing:-.04em;text-align:center;line-height:1.1}
.stepper{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0}
.stepper .btn{padding:12px 0;font-size:15px}
input[type=range]{width:100%;accent-color:var(--pri);height:32px}

/* sticky confirm */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(242,244,246,0),var(--bg) 40%)}
.dock .in{max-width:520px;margin:0 auto}

/* toast / banner */
#toasts{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,460px)}
.toast{background:#191f28;color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:toastin .3s cubic-bezier(.3,1.5,.5,1);font-size:14px}
.toast.bad{background:var(--bad)} .toast.ok{background:var(--ok)}
@keyframes toastin{from{transform:translateY(-14px);opacity:0}}
#netbanner{position:fixed;left:0;right:0;top:0;z-index:99;background:var(--warn);color:#2b1d00;text-align:center;font-weight:700;padding:8px;font-size:13px}
.spinner{width:30px;height:30px;border-radius:50%;border:4px solid #dfe3e8;border-top-color:var(--pri);animation:spin .8s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.boot{min-height:70vh;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;color:var(--ink3)}

/* modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(15,20,28,.5);display:flex;align-items:center;justify-content:center;padding:16px}
.modal>.box{background:#fff;border-radius:24px;padding:22px;max-width:560px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:toastin .25s cubic-bezier(.3,1.5,.5,1)}
.modal h3{font-size:18px;margin-bottom:10px}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
pre.log{background:#0f1520;color:#cfe3ff;border-radius:14px;padding:14px;font-size:12.5px;max-height:50vh;overflow:auto;white-space:pre-wrap}

/* teacher */
.tgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:900px){.tgrid{grid-template-columns:1fr}}
.phases{display:flex;gap:6px;flex-wrap:wrap}
.phases .p{flex:1;min-width:64px;text-align:center;padding:8px 4px;border-radius:12px;background:#eef0f3;font-size:12.5px;font-weight:700;color:var(--ink3)}
.phases .p.on{background:var(--pri);color:#fff;box-shadow:0 6px 14px rgba(49,130,246,.3)}
.phases .p.past{background:var(--pri-bg);color:var(--pri-d)}
.drawer-btn{font-size:20px}
.demo-bar{position:fixed;right:10px;top:62px;z-index:35;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.demo-menu{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.demo-bar .btn{background:#191f28;color:#fff;font-size:12.5px;padding:8px 12px;min-height:34px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.demo-flag{background:var(--warn);color:#2b1d00;font-weight:800;font-size:12px;padding:3px 9px;border-radius:99px}
.bar{height:8px;border-radius:99px;background:var(--pri);min-width:3px}

/* TV */
#tv{position:fixed;inset:0;z-index:80;background:radial-gradient(1200px 700px at 50% -10%,#1a2440,#0a0d14 70%);color:#f2f5fa;display:flex;flex-direction:column;padding:2.2vh 3vw;gap:1.6vh}
#tv .tvtop{display:flex;align-items:center;gap:14px}
#tv .tvtitle{font-size:clamp(20px,3.4vh,40px);font-weight:800;letter-spacing:-.02em}
#tv .tvsub{color:#9fb0cc;font-size:clamp(14px,2.2vh,24px)}
#tv .btn{background:rgba(255,255,255,.1);color:#fff;box-shadow:none}
#tv .btn:hover{background:rgba(255,255,255,.2)}
#tv .stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#tv .room{width:min(100%,calc((100vh - 18vh) * var(--aspect,1.5)));max-height:100%}
#tv .room .deskbar{background:#26324d;color:#aab8d6;font-size:clamp(12px,2vh,22px)}
#tv .room .side.win{background:linear-gradient(180deg,#244a78,#1b3a60);color:#9cc7ff}
#tv .room .side.hall{background:#1a2234;color:#6f7f9d}
#tv .seat{background:#18203a;border-color:#2b3658;color:#f2f5fa;border-radius:12%}
#tv .seat.off{background:transparent;border-color:#26304c;color:#35405e}
#tv .seat .nm{font-size:max(12px,calc(100cqw / var(--n) * .3));font-weight:800}
#tv .seat.filled.bet{background:linear-gradient(160deg,#3a2d00,#7a5a00);border-color:var(--gold);box-shadow:0 0 22px rgba(255,179,0,.35)}
#tv .seat.filled.random{background:linear-gradient(160deg,#10305f,#1f5fb8);border-color:#5aa0ff}
#tv .seat.filled.nolabel{background:#1f2a4a;border-color:#4a5b8a}
#tv .seat.swap{box-shadow:0 0 0 3px #ff7ad9}
#tv .seat .tag{font-size:max(10px,calc(100cqw / var(--n) * .24))}
#tv .legend{display:flex;gap:18px;justify-content:center;color:#9fb0cc;font-size:clamp(12px,2vh,20px)}
#tv .counter{font-size:clamp(18px,3.4vh,40px);font-weight:800;font-variant-numeric:tabular-nums}
.confetti{position:fixed;top:-20px;font-size:26px;z-index:90;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important}}
</style>
</head>

<script type="module">
// ───────────────────────────────────────────────────────────────
// Firebase 설정: 콘솔의 [프로젝트 설정 → 내 앱 → 웹 앱]에서 복사해 붙여넣으세요.
// (이 값은 공개되어도 괜찮은 식별자입니다. 보안은 database.rules.json이 담당합니다.)
// ───────────────────────────────────────────────────────────────
const firebaseConfig = {
  apiKey: "AIzaSyCp5L2HyEjjzwmOLE0RkLxgY0dhp7TsaUU",
  authDomain: "wkfl-3fdb2.firebaseapp.com",
  databaseURL: "https://wkfl-3fdb2-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "wkfl-3fdb2",
  appId: "1:531554762352:web:81cba09e51e78bd7743eb5"
};
const FIREBASE_SDK_VERSION = "12.19.0";

/* <draw-core> */
// ═══════════════ 순수 함수 영역: DOM·네트워크에 의존하지 않음 (Node에서도 테스트됨) ═══════════════
const seatId = (r, c) => `r${r}c${c}`;
const parseSeat = (id) => { const m = /^r(\d+)c(\d+)$/.exec(id || ''); return m ? { r: +m[1], c: +m[2] } : null; };
const cmpSeat = (a, b) => { const x = parseSeat(a), y = parseSeat(b); return x.r - y.r || x.c - y.c; };

// 시드 기반 난수: splitmix32로 상태를 채운 sfc32. 같은 시드 + 같은 입력 = 같은 결과.
function makeRng(seed) {
  let s = seed | 0;
  const sm = () => { s = (s + 0x9e3779b9) | 0; let t = s ^ (s >>> 16); t = Math.imul(t, 0x21f0aaad); t ^= t >>> 15; t = Math.imul(t, 0x735a2d97); return (t ^ (t >>> 15)) | 0; };
  let a = sm(), b = sm(), c = sm(), d = sm();
  const next = () => {
    const t = (((a + b) | 0) + d) | 0;
    d = (d + 1) | 0; a = b ^ (b >>> 9); b = (c + (c << 3)) | 0; c = (c << 21) | (c >>> 11); c = (c + t) | 0;
    return (t >>> 0) / 4294967296;
  };
  for (let i = 0; i < 12; i++) next();
  return {
    next,
    int: (n) => Math.floor(next() * n),
    shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(next() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; },
  };
}

function groupSizes(cols, groups) {
  const g = Math.max(1, Math.min(groups | 0 || 1, cols));
  const base = Math.floor(cols / g), extra = cols % g;
  return Array.from({ length: g }, (_, i) => base + (i < extra ? 1 : 0));
}
function groupOfCol(c, cols, groups) {
  const sz = groupSizes(cols, groups); let acc = 0;
  for (let i = 0; i < sz.length; i++) { acc += sz[i]; if (c <= acc) return i; }
  return sz.length - 1;
}
// 체비쇼프 거리 1 이내(상하좌우+대각선). 분단(통로)을 가로지르면 인접으로 보지 않는다.
function areAdjacent(sa, sb, cfg) {
  const a = parseSeat(sa), b = parseSeat(sb);
  if (!a || !b || sa === sb) return false;
  if (Math.max(Math.abs(a.r - b.r), Math.abs(a.c - b.c)) > 1) return false;
  return groupOfCol(a.c, cfg.cols, cfg.groups) === groupOfCol(b.c, cfg.cols, cfg.groups);
}
function allSeatIds(cfg) {
  const out = [];
  for (let r = 1; r <= cfg.rows; r++) for (let c = 1; c <= cfg.cols; c++) out.push(seatId(r, c));
  return out;
}
function activeSeatIds(cfg) { const dis = cfg.disabled || {}; return allSeatIds(cfg).filter((id) => !dis[id]); }
function seatsMap(cfg) { const m = {}; for (const id of activeSeatIds(cfg)) m[id] = true; return m; }
const seatLabel = (id) => { const p = parseSeat(id); return p ? `${p.r}행 ${p.c}열` : id; };

// 베팅 검증. 하나라도 이상하면 그 학생의 베팅 전체를 무효로 하고 사유를 남긴다.
function validateBets(bets, rosterSids, activeSeats, budget) {
  const roster = new Set(rosterSids), active = new Set(activeSeats);
  const valid = {}, invalid = [], confirmed = new Set();
  for (const sid of Object.keys(bets || {}).sort()) {
    const b = bets[sid];
    if (!roster.has(sid)) { invalid.push({ sid, reason: '미등록 학번' }); continue; }
    if (!b || b.confirmed !== true) continue; // 확정 전 데이터는 제출로 보지 않는다

    else if (!name) problem = '이름 없음';
    else if (name.length > 20) problem = '이름이 너무 김';
    else if (seen.has(sid)) problem = '중복 학번';

function parsePairsText(text) {
  const pairs = [], bad = [];
  for (const line of text.split(/\r?\n/)) {
    const t = line.trim(); if (!t) continue;
    let m = t.split(/[\s,;|~=↔]+/).filter(Boolean);
    if (m.length === 1 && m[0].includes('-')) m = m[0].split('-').filter(Boolean);
    if (m.length === 2 && m[0] !== m[1]) pairs.push({ a: m[0], b: m[1] }); else bad.push(t);
  }
  return { pairs, bad };
}

// restore(role) signInAnon() signInTeacher(e,p) signOut(role) uid(role)
// get/set/update/remove(role, …)  on(role, path, cb, errCb) → unsubscribe  onConnected(cb)
// update(role, {절대경로: 값})는 한 번에 원자적으로 적용된다. 값에는 SV.ts()/SV.inc(n)를 쓸 수 있다.

async function createFirebaseBackend() {
  const base = `https://www.gstatic.com/firebasejs/${FIREBASE_SDK_VERSION}/`;
  const [appM, authM, dbM] = await Promise.all([
    import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-database.js'),
  ]);
  const ctxs = {};
  // 교사/학생 세션이 서로 덮어쓰지 않도록 이름이 다른 Firebase 앱 두 개를 쓴다(Auth 영속 저장소가 앱 이름별로 분리됨).
  const EMU = new URLSearchParams(location.search).get('emulator'); // 개발용: ?emulator=1 → 로컬 Firebase 에뮬레이터(Auth 9099 / DB 9000)
  const ctx = (role) => (ctxs[role] ||= (() => {
    const app = appM.initializeApp(firebaseConfig, role), auth = authM.getAuth(app), db = dbM.getDatabase(app);
    if (EMU) { authM.connectAuthEmulator(auth, 'http://127.0.0.1:9099', { disableWarnings: true }); dbM.connectDatabaseEmulator(db, '127.0.0.1', 9000); }
    return { auth, db };
  })());
  const R = (role, path) => dbM.ref(ctx(role).db, path);
  return {
    kind: 'firebase',
    restore: (role) => new Promise((res) => { const a = ctx(role).auth; const un = authM.onAuthStateChanged(a, (u) => { un(); res(u ? { uid: u.uid, anonymous: u.isAnonymous } : null); }); }),
    async signInAnon() { const a = ctx('student').auth; if (a.currentUser) return { uid: a.currentUser.uid }; const c = await authM.signInAnonymously(a); return { uid: c.user.uid }; },
    async signInTeacher(email, pw) { const c = await authM.signInWithEmailAndPassword(ctx('teacher').auth, email, pw); return { uid: c.user.uid }; },
    signOut: (role) => authM.signOut(ctx(role).auth),
    uid: (role) => ctx(role).auth.currentUser?.uid || null,
    get: async (role, path) => (await dbM.get(R(role, path))).val(),
    set: (role, path, v) => dbM.set(R(role, path), v),
    update: (role, obj) => dbM.update(dbM.ref(ctx(role).db), obj),
    remove: (role, path) => dbM.remove(R(role, path)),
    on: (role, path, cb, errCb) => dbM.onValue(R(role, path), (s) => cb(s.val()), (e) => errCb && errCb(e)),
    onConnected: (role, cb) => dbM.onValue(R(role, '.info/connected'), (s) => cb(!!s.val())),
  };
}

const DEMO_NAMES = ['김민준','이서연','박지호','최수아','정하준','강지우','조서윤','윤도현','장하은','임시우','한예준','오지안','서유진','신주원','권민서','황지훈','안소율','송준서','류하린','전건우','홍다은','고은우','문채원','양지민','손예린','배현우','백나연','허민재','노서현','유태오','남가은'];

async function createDemoBackend() {
  const SKEY = 'cs:demo-tree';
  const clone = (v) => (v === undefined ? null : JSON.parse(JSON.stringify(v)));
  const sess = (k, d) => { try { return sessionStorage.getItem(k) ?? d; } catch { return d; } };
  const sset = (k, v) => { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch { /* noop */ } };
  let tree = null;
  try { tree = JSON.parse(sessionStorage.getItem(SKEY) || 'null'); } catch { /* noop */ }
  if (!tree) tree = await seedDemoTree();
  let saveT = 0;
  const persist = () => { clearTimeout(saveT); saveT = setTimeout(() => sset(SKEY, JSON.stringify(tree)), 250); };
  const studentUid = sess('cs:demo-uid', null) || ('demo-s-' + Math.random().toString(36).slice(2, 10));
  sset('cs:demo-uid', studentUid);
  const uidOf = { student: studentUid, teacher: 'demo-teacher' };
  const signed = { student: sess('cs:demo-in-student') === '1', teacher: sess('cs:demo-in-teacher') === '1' };
  const P = (path) => path.split('/').filter(Boolean);
  const getAt = (p) => { let n = tree; for (const k of p) { if (n == null || typeof n !== 'object') return null; n = n[k]; } return n === undefined ? null : n; };
  const err = (m) => Object.assign(new Error('PERMISSION_DENIED: ' + m), { code: 'PERMISSION_DENIED' });

  // 보안 규칙(database.rules.json)을 흉내 낸 간이 검사: 클라이언트가 규칙에 어긋나는 접근을 하면 데모에서도 실패하도록
  let pendingVal = null;
  const isAdmin = (role) => role === '__root' || (role === 'teacher' && signed.teacher);
  const member = (role, room) => !!getAt(['rooms', room, 'members', uidOf[role]]);
  const myBinding = (role, room, sid) => getAt(['rooms', room, 'bindings', sid, 'uid']) === uidOf[role];
  const phase = (room) => getAt(['rooms', room, 'state', 'phase']);
  function canRead(role, p) {
    if (isAdmin(role)) return true;
    if (role !== 'student' || !signed.student) return false;
    const [a, room, b, c] = p;
    if (a === 'pinKeys') return p.length === 3;
    if (a !== 'rooms' || !room) return false;
    if (b === 'members') return p.length === 4 && c === uidOf[role];
    if (b === 'uids') return p.length === 4 && c === uidOf[role];
    if (!member(role, room)) return false;
    if (['config', 'state', 'roster', 'totals', 'history'].includes(b)) return true;
    if (b === 'bindings') return p.length === 4 && (!getAt(['rooms', room, 'bindings', c]) || myBinding(role, room, c));
    if (b === 'bets') return p.length === 4 && myBinding(role, room, c);
    if (b === 'result') return phase(room) === 'done';
    return false;
  }
  function canWrite(role, p) {
    if (isAdmin(role)) return true;
    if (role !== 'student' || !signed.student) return false;
    const [a, room, b, c] = p; const me = uidOf.student;
    if (a !== 'rooms' || !room) return false;
    if (b === 'members') return p.length === 4 && c === me && !!pendingVal && !!getAt(['pinKeys', room, pendingVal.k]);
    if (!member(role, room)) return false;
    if (b === 'bindings') return p.length === 4 && !getAt(p) && !getAt(['rooms', room, 'uids', me]) && !!getAt(['rooms', room, 'roster', c]);
    if (b === 'uids') return p.length === 4 && c === me && getAt(['rooms', room, 'bindings', pendingVal, 'uid']) === me;
    if (b === 'bets') return myBinding(role, room, c) && phase(room) === 'betting';
    if (b === 'totals') return !!getAt(['rooms', room, 'uids', me]) && phase(room) === 'betting';
    return false;
  }
  function resolveSV(v, old) {
    if (v && typeof v === 'object' && '.sv' in v) {
      if (v['.sv'] === 'timestamp') return Date.now();
      if (v['.sv'].increment != null) return (typeof old === 'number' ? old : 0) + v['.sv'].increment;
    }
    if (v && typeof v === 'object') {
      const o = {}; let any = false;
      for (const [k, x] of Object.entries(v)) { const r = resolveSV(x, old && typeof old === 'object' ? old[k] : null); if (r != null) { o[k] = r; any = true; } }
      return any ? o : null;
    }
    return v === undefined ? null : v;
  }
  function setAt(p, v) {
    if (!p.length) { tree = v || {}; return; }
    const stack = []; let n = tree;
    for (let i = 0; i < p.length - 1; i++) { stack.push([n, p[i]]); if (n[p[i]] == null || typeof n[p[i]] !== 'object') { if (v == null) return; n[p[i]] = {}; } n = n[p[i]]; }
    const last = p[p.length - 1];
    if (v == null) delete n[last]; else n[last] = v;
    for (let i = stack.length - 1; i >= 0; i--) { const [par, k] = stack[i]; if (par[k] && Object.keys(par[k]).length === 0) delete par[k]; else break; }
  }
  const listeners = new Set(), connCbs = new Set();
  function notify() {
    persist();
    for (const l of [...listeners]) {
      let val;
      if (!canRead(l.role, l.p)) { if (!l.denied) { l.denied = true; l.errCb && setTimeout(() => l.errCb(err(l.p.join('/'))), 0); } continue; }
      l.denied = false; val = getAt(l.p);
      const j = JSON.stringify(val); if (j === l.last) continue; l.last = j;

  };
  const be = {
    kind: 'demo', raw: { tree: () => tree, apply: (e) => apply('__root', e), reset: async () => { tree = await seedDemoTree(); sset(SKEY, JSON.stringify(tree)); notify(); } },
    restore: async (role) => (signed[role] ? { uid: uidOf[role] } : null),
    async signInAnon() { signed.student = true; sset('cs:demo-in-student', '1'); return { uid: uidOf.student }; },
    async signInTeacher() { await sleep(250); signed.teacher = true; sset('cs:demo-in-teacher', '1'); return { uid: uidOf.teacher }; },
    async signOut(role) { signed[role] = false; sset('cs:demo-in-' + role, null); notify(); },
    uid: (role) => (signed[role] ? uidOf[role] : null),
    async get(role, path) { await sleep(30); const p = P(path); if (!canRead(role, p)) throw err(path); return clone(getAt(p)); },
    async set(role, path, v) { await sleep(30); apply(role, [[path, v]]); },
    async update(role, obj) { await sleep(30); apply(role, Object.entries(obj)); },
    async remove(role, path) { await sleep(30); apply(role, [[path, null]]); },
    on(role, path, cb, errCb) { const l = { role, p: P(path), cb, errCb, last: undefined, denied: false }; listeners.add(l); setTimeout(() => { if (!listeners.has(l)) return; if (!canRead(role, l.p)) { l.denied = true; errCb && errCb(err(path)); return; } const v = getAt(l.p); l.last = JSON.stringify(v); cb(clone(v)); }, 0); return () => listeners.delete(l); },
    onConnected(role, cb) { connCbs.add(cb); setTimeout(() => cb(true), 0); return () => connCbs.delete(cb); },
  };
  return be;
}

function errMsg(e) {

  if (/operation-not-allowed|admin-restricted/.test(c)) return 'Firebase 콘솔의 Authentication에서 이 로그인 방식을 켜 주세요.';
  if (/invalid-credential|wrong-password|user-not-found|invalid-email|invalid-login/.test(c)) return '이메일 또는 비밀번호가 올바르지 않아요.';

  if (/permission[\s_-]*denied/i.test(c)) return '권한이 없어요. (입장하지 않았거나, 지금 단계에서는 수정할 수 없어요)';

// 자리 그리드: 구조는 한 번 만들고, 값만 갱신한다(숫자가 바뀔 때 튀는 애니메이션을 유지하기 위해).
function buildGrid(cfg, { onSeat } = {}) {
  const sz = groupSizes(cfg.cols, cfg.groups), items = [];
  const aisleW = 0.45 * (cfg.aisle || 1) + 0.15;
  let c = 0;
  for (let g = 0; g < sz.length; g++) {
    for (let k = 0; k < sz[g]; k++) {
      c++; items.push({ t: 'c', c });
      if (k < sz[g] - 1) items.push({ t: 'g', w: cfg.mode === 'exam' ? 0.22 : (k % 2 === 0 ? 0.05 : 0.24) });
    }
    if (g < sz.length - 1) items.push({ t: 'g', w: aisleW });
  }
  if (cfg.mirror) items.reverse();
  const colIndex = {}; items.forEach((it, i) => { if (it.t === 'c') colIndex[it.c] = i + 1; });
  const n = cfg.cols + items.filter((i) => i.t === 'g').reduce((s, i) => s + i.w, 0);
  const grid = h('div', { class: 'seatgrid', style: { gridTemplateColumns: items.map((i) => (i.t === 'c' ? 'minmax(0,1fr)' : `${i.w}fr`)).join(' '), rowGap: cfg.mode === 'exam' ? '10px' : '6px' } });

  const dis = cfg.disabled || {}, els = new Map();
  const rowDisp = (r) => (cfg.deskPos === 'bottom' ? cfg.rows - r + 1 : r);
  for (let r = 1; r <= cfg.rows; r++) for (let cc = 1; cc <= cfg.cols; cc++) {
    const id = seatId(r, cc), off = !!dis[id];
    const el = h('button', { type: 'button', class: 'seat' + (off ? ' off' : ''), 'data-seat': id, title: seatLabel(id), style: { gridRow: rowDisp(r), gridColumn: colIndex[cc] },
      onclick: () => onSeat && onSeat(id, el, off) }, h('span', { class: 'num' }, off ? '✕' : '0'), off ? null : h('span', { class: 'nm hidden' }));
    el._num = el.firstChild; el._nm = el.children[1]; el._id = id; el._off = off;
    els.set(id, el); grid.append(el);
  }
  const winLeft = !cfg.mirror;
  const side = (k) => h('div', { class: 'side ' + k }, k === 'win' ? '창문' : '복도');
  const mid = h('div', { class: 'mid' }, side(winLeft ? 'win' : 'hall'), grid, side(winLeft ? 'hall' : 'win'));
  const desk = h('div', { class: 'deskbar' }, '교탁');
  const el = h('div', { class: 'room' }, cfg.deskPos === 'bottom' ? [mid, desk] : [desk, mid]);
  const CLS = ['mine', 'me', 'sel', 'empty', 'dim', 'static', 'filled', 'bet', 'random', 'nolabel', 'swap'];
  return {
    el, els, ratio: (n + 0.8) / (cfg.rows + 1.3),
    set(id, st) {
      const e = els.get(id); if (!e || e._off) return;
      const prev = e._st || (e._st = {});
      if ('num' in st && st.num !== prev.num) {
        e._num.textContent = st.num;
        if (prev.num !== undefined && !st.quiet) { e._num.classList.remove('pop'); void e._num.offsetWidth; e._num.classList.add('pop'); }
        prev.num = st.num;
      }
      if ('name' in st && st.name !== prev.name) { // 이름 표시 모드(결과 화면)
        const has = st.name != null;
        e._nm.textContent = has ? st.name : ''; e._nm.classList.toggle('hidden', !has); e._num.classList.toggle('hidden', has); prev.name = st.name;
      }
      if ('badge' in st && (st.badge !== prev.badge || st.draft !== prev.draft)) {
        e.querySelector('.badge')?.remove();
        if (st.badge) e.append(h('span', { class: 'badge' + (st.draft ? ' draft' : '') }, st.badge));
        prev.badge = st.badge; prev.draft = st.draft;

      if ('tag' in st && st.tag !== prev.tag) { e.querySelector('.tag')?.remove(); if (st.tag) e.append(h('span', { class: 'tag' }, st.tag)); prev.tag = st.tag; }

}

// 지난 회차 자리 카드(학생·교사 공용). history: { 회차번호: { round, layout, assign, types } }
function makeHistoryCard() {
  let sel = null, lastSig = '', last = { history: null, roster: null, me: null };
  const select = h('select', { class: 'input', style: { width: 'auto', padding: '6px 10px', fontWeight: 700 }, onchange: (e) => { sel = +e.target.value; render(); } });
  const meta = h('p', { class: 'small muted', style: { margin: '-4px 0 12px' } }), gridHost = h('div');
  const el = h('div', { class: 'card hidden' }, h('div', { class: 'row', style: { marginBottom: '8px' } }, h('h2', { style: { margin: 0 } }, '지난 회차 자리'), h('span', { class: 'grow' }), select), meta, gridHost);
  function render() {
    const { history, roster, me } = last, rounds = Object.keys(history || {}).map(Number).sort((a, b) => b - a);
    el.classList.toggle('hidden', !rounds.length);
    if (!rounds.length) { lastSig = ''; return; }
    if (!rounds.includes(sel)) sel = rounds[0];
    const e = history[sel], sig = JSON.stringify([sel, rounds, e, me, roster]);
    if (sig === lastSig) return; lastSig = sig;
    put(select, ...rounds.map((r) => h('option', { value: r, selected: r === sel }, `${r}회차`)));
    select.classList.toggle('hidden', rounds.length < 2);
    const grid = buildGrid(e.layout), bySeat = {};

    const ty = e.types || {};
    for (const id of activeSeatIds(e.layout)) { const sid = bySeat[id]; grid.set(id, { name: sid ? (roster?.[sid]?.name || sid) : '', tag: sid ? (ty[sid] === 'bet' ? '🎯' : ty[sid] === 'random' ? '🎲' : null) : null, heat: 0, cls: { me: !!me && sid === me, empty: !sid, static: true } }); }
    put(gridHost, grid.el);

}

// 효과음: Web Audio로 직접 합성(외부 음원 없음)
const Snd = {
  ctx: null, muted: !!ls.get('mute', false),
  ensure() { if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch { /* 미지원 */ } } if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); return this.ctx; },
  setMuted(m) { this.muted = m; ls.set('mute', m); },
  _tone(freq, t0, dur, { type = 'sine', gain = 0.3, to = null } = {}) {
    const c = this.ctx; if (!c || this.muted) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0); if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(gain, t0 + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(c.destination); o.start(t0); o.stop(t0 + dur + 0.02);
  },
  thunk(i = 0, bet = false) { // "통!"
    if (!this.ensure() || this.muted) return; const t = this.ctx.currentTime;
    this._tone(bet ? 190 : 150, t, 0.16, { to: 60, gain: 0.5 });
    this._tone(bet ? 760 : 520, t, 0.05, { type: 'triangle', gain: 0.12, to: 300 });
    if (bet) this._tone(1180 + (i % 5) * 60, t + 0.02, 0.18, { gain: 0.08, to: 900 });

function confetti(n = 46) {

async function studentJoin({ code, pin, sid, name }) {
  const be = App.be; code = normCode(code); sid = String(sid).trim(); name = String(name).trim();
  if (!validCode(code)) throw userErr('방 코드를 확인해 주세요.');
  if (!/^\d{6}$/.test(pin)) throw userErr('방 PIN은 숫자 6자리예요.');
  if (!validSid(sid) || !name) throw userErr('학번과 이름을 입력해 주세요.');
  const me = await be.signInAnon(), hash = await pinHash(code, pin);
  const okKey = await be.get('student', `pinKeys/${code}/${hash}`);
  if (!okKey) throw userErr('방 코드 또는 PIN이 올바르지 않아요.');
  await be.set('student', `rooms/${code}/members/${me.uid}`, { k: hash });
  const rec = await be.get('student', `rooms/${code}/roster/${sid}`);
  if (!rec || normName(rec.name) !== normName(name)) throw userErr('명단에 없는 학번이거나 이름이 달라요. 다시 확인해 주세요.');
  const mine = await be.get('student', `rooms/${code}/uids/${me.uid}`);
  if (mine && mine !== sid) throw userErr(`이 기기는 이미 학번 ${mine}(으)로 입장했어요. 그 학번으로 입장하거나 선생님께 초기화를 요청하세요.`);
  let bound;
  try { bound = await be.get('student', `rooms/${code}/bindings/${sid}`); }
  catch (e) { if (/permission/i.test(String(e.code || e.message))) throw userErr('이 학번은 다른 기기에 이미 묶여 있어요. 선생님께 초기화를 요청하세요.'); throw e; }
  if (bound && bound.uid !== me.uid) throw userErr('이 학번은 다른 기기에 이미 묶여 있어요. 선생님께 초기화를 요청하세요.');
  if (!bound) {
    try { await be.set('student', `rooms/${code}/bindings/${sid}`, { uid: me.uid, name: rec.name }); }
    catch (e) { throw userErr('입장 처리 중 충돌이 있었어요(다른 기기가 먼저 입장했을 수 있어요). 선생님께 초기화를 요청하세요.'); }
  }
  if (!mine) await be.set('student', `rooms/${code}/uids/${me.uid}`, sid);
  const sess = { code, sid, name: rec.name }; ls.set('session', sess); return sess;
}

  };
  sub('config', (v) => { St.cfg = v; refresh(); });

  sub(`bets/${sid}`, (v) => { St.bet = v; St.betLoaded = true; refresh(); });

  const closeSheet = () => { sheetSeat = null; scrim.classList.remove('on'); sheet.classList.remove('on'); update(); };
  const openSheet = (id) => { sheetSeat = id; scrim.classList.add('on'); sheet.classList.add('on'); update(); };

  const budget = () => St.cfg.budget || 100;
  const saveDraft = () => ls.set(`draft:${code}:${St.state.round || 1}:${sid}`, draft);

  async function confirmBet() {

    const bet = { seats, confirmed: true, submittedAt: SV.ts() };

// ═══════════════ 데모 도구 · 부팅 ═══════════════
function setupDemoBar() {
  let botRun = 0;
  const be = () => App.be;
  async function runBots() {
    if (botRun) { botRun++; botBtn.textContent = '🤖 가상 학생 31명 베팅'; return toast('시뮬레이션을 멈췄어요'); }
    const tree = be().raw.tree(), room = tree.rooms?.demo;
    if (!room?.config || !room.roster) return toast('데모 방이 없어요. 데모 초기화를 눌러 주세요', 'bad');
    if (room.state.phase === 'setup') { be().raw.apply([['rooms/demo/state/phase', 'betting'], ['rooms/demo/config/seats', seatsMap(room.config)]]); toast('베팅을 자동으로 시작했어요'); }
    else if (room.state.phase !== 'betting') return toast('베팅 중일 때만 시뮬레이션할 수 있어요 (교사 화면에서 새 회차/베팅 재개)', 'bad');
    const me = ls.get('session')?.sid, run = ++botRun; botBtn.textContent = '⏹ 시뮬레이션 중지';
    const cfg = room.config, active = activeSeatIds(cfg), sids = Object.keys(room.roster).sort().filter((s) => s !== me);
    const hot = (id) => { const { r, c } = parseSeat(id); return 1 + 7 * Math.exp(-(((r - 2) ** 2) + ((c - 3.5) ** 2)) / 5) + Math.random() * 2; };
    const w = Object.fromEntries(active.map((id) => [id, hot(id)]));
    const place = (sid, first) => {
      const cur = be().raw.tree().rooms.demo, old = cur.bets?.[sid]?.seats || {};
      const pool = [...active], picks = [], n = 2 + Math.floor(Math.random() * 5);
      for (let k = 0; k < n && pool.length; k++) { const tot = pool.reduce((s, x) => s + w[x], 0); let r = Math.random() * tot, i = 0; for (; i < pool.length - 1; i++) { r -= w[pool[i]]; if (r < 0) break; } picks.push(pool.splice(i, 1)[0]); }
      const T0 = 40 + Math.floor(Math.random() * 61), ws = picks.map(() => 0.3 + Math.random()), sw = ws.reduce((x, y) => x + y, 0);
      let rem = T0; const seats = {};
      picks.forEach((p, i) => { const v = i === picks.length - 1 ? rem : Math.max(1, Math.min(rem - (picks.length - 1 - i), Math.floor(T0 * ws[i] / sw))); seats[p] = v; rem -= v; });
      const uid = 'bot-' + sid, e = [];
      if (first && sid !== '30101') e.push([`rooms/demo/members/${uid}`, { k: 'bot' }], [`rooms/demo/bindings/${sid}`, { uid, name: room.roster[sid].name }], [`rooms/demo/uids/${uid}`, sid]);
      e.push([`rooms/demo/bets/${sid}`, { seats, confirmed: true, submittedAt: { '.sv': 'timestamp' } }]);
      for (const k of new Set([...Object.keys(old), ...Object.keys(seats)])) { const d = (seats[k] || 0) - (old[k] || 0); if (d) e.push([`rooms/demo/totals/${k}`, SV.inc(d)]); }
      be().raw.apply(e);
    };

    for (let k = 0; k < 10; k++) { if (run !== botRun) return; if (be().raw.tree().rooms.demo.state.phase !== 'betting') break; try { place(sids[Math.floor(Math.random() * sids.length)], false); } catch { /* noop */ } await sleep(350); }
    if (run === botRun) { botRun = 0; botBtn.textContent = '🤖 가상 학생 31명 베팅'; toast('가상 학생 베팅이 끝났어요', 'ok'); }
  }
